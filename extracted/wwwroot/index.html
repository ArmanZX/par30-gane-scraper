<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Par30 Games API Panel</title>
<style>
body{font-family:Tahoma,Arial;background:#101114;color:#eee;margin:0}header{padding:22px;background:#17191e;position:sticky;top:0}
h1{margin:0;font-size:22px}.wrap{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#191c22;border:1px solid #292d35;border-radius:14px;padding:14px}.card img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#111}
button,input{padding:11px;border-radius:9px;border:1px solid #333;background:#20242b;color:#fff}button{cursor:pointer}.bar{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0d10;padding:15px;border-radius:10px}
a{color:#8ab4ff}
</style></head>
<body><header><div class="wrap"><h1>پنل Par30 Games Scraper</h1></div></header>
<main class="wrap">
<div class="bar"><input id="q" placeholder="جستجوی بازی..."><button onclick="search()">جستجو</button><button onclick="games()">بازی‌های PC</button><button onclick="cats()">دسته‌بندی‌ها</button></div>
<div id="out"></div>
</main>
<script>
const out=document.getElementById('out');
async function api(u){out.innerHTML='<p>در حال دریافت...</p>';const r=await fetch(u);const x=await r.json();render(x)}
function render(x){
 if(!Array.isArray(x)){out.innerHTML='<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';return}
 out.innerHTML='<div class="grid">'+x.map(g=>g.id?`<div class="card"><img src="${esc(g.image)}"><h3>${esc(g.name)}</h3><small>ID: ${g.id}</small><p><a href="${esc(g.url)}" target="_blank">صفحه بازی</a></p><button onclick="api('/api/games/'+g.id)">جزئیات</button></div>`:`<div class="card"><h3>${esc(g.name)}</h3><a href="${esc(g.url)}" target="_blank">${esc(g.url)}</a><br><button onclick="api('/api/games/category?url='+encodeURIComponent(g.url))">بازی‌ها</button></div>`).join('')+'</div>'
}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function games(){api('/api/games?page=1')} function cats(){api('/api/games/categories')}
function search(){api('/api/games/search?q='+encodeURIComponent(document.getElementById('q').value))}
games();
</script></body></html>
